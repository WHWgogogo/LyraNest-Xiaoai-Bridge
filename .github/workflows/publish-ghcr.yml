name: Publish GHCR Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        default: '1.0.8'
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release tar
        id: dl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if gh release download "v${VERSION}" --pattern "*docker-image*.tar" --repo "${{ github.repository }}"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No docker-image tar asset in release v${VERSION}, skipping GHCR push."
          fi

      - name: Load Docker Image
        if: steps.dl.outputs.found == 'true'
        run: |
          TAR_FILE=$(ls *docker-image*.tar | head -n 1)
          echo "Loading $TAR_FILE"
          docker load -i "$TAR_FILE"
          docker images

      - name: Log in to GHCR
        if: steps.dl.outputs.found == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Image
        if: steps.dl.outputs.found == 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          IMAGE_TAG="lyranest-xiaoai-bridge:${VERSION}"
          TARGET_IMAGE="ghcr.io/whwgogogo/lyranest-xiaoai-bridge"

          docker tag "$IMAGE_TAG" "${TARGET_IMAGE}:${VERSION}"
          docker tag "$IMAGE_TAG" "${TARGET_IMAGE}:latest"

          echo "Pushing ${TARGET_IMAGE}:${VERSION}..."
          docker push "${TARGET_IMAGE}:${VERSION}"
          echo "Pushing ${TARGET_IMAGE}:latest..."
          docker push "${TARGET_IMAGE}:latest"

